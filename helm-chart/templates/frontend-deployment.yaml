{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prima-nota.fullname" . }}-frontend
  labels:
    {{- include "prima-nota.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      {{- include "prima-nota.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      annotations:
        # Configurazione nginx cambiata -> pod nuovi (nginx la legge solo all'avvio).
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "prima-nota.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: frontend
        image: "{{ .Values.frontend.image.registry }}/{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
        imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
        env:
        - name: REACT_APP_API_URL
          value: "/api"
        - name: REACT_APP_NAME
          value: {{ .Values.frontend.env.REACT_APP_NAME }}
        - name: REACT_APP_VERSION
          value: {{ .Values.frontend.env.REACT_APP_VERSION }}
        # Variabili del modello nginx (files/nginx/default.conf.template).
        - name: BACKEND_UPSTREAM
          value: "{{ include "prima-nota.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.service.port }}"
        - name: CLIENT_MAX_BODY_SIZE
          value: {{ include "prima-nota.nginxMaxBody" . | quote }}
        - name: NGINX_ENTRYPOINT_LOCAL_RESOLVERS
          value: "1"
        ports:
        - name: frontend
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/templates
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: frontend
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: frontend
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          {{- toYaml .Values.frontend.resources | nindent 10 }}
      volumes:
      - name: nginx-config
        configMap:
          name: {{ include "prima-nota.fullname" . }}-config
          items:
          - key: default.conf.template
            path: default.conf.template
{{- end }}
