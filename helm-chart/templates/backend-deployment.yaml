{{- if .Values.backend.enabled }}
{{- $p := .Values.backend.allegati.persistence }}
{{- if and (gt (int .Values.backend.replicaCount) 1) (not (and $p.enabled (has "ReadWriteMany" $p.accessModes))) }}
{{- fail "backend.replicaCount > 1 richiede backend.allegati.persistence con accessModes [ReadWriteMany]: ogni replica deve vedere gli stessi file degli allegati" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "prima-nota.fullname" . }}-backend
  labels:
    {{- include "prima-nota.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  {{- if include "prima-nota.allegatiEsclusivo" . }}
  # Volume senza ReadWriteMany: il pod nuovo parte dopo che il vecchio ha lasciato
  # il volume (con RollingUpdate resterebbe in attesa: con ReadWriteOnce se finisce
  # su un altro nodo, con ReadWriteOncePod sempre).
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "prima-nota.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "prima-nota.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: backend
        image: "{{ .Values.backend.image.registry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
        imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
        env:
        {{- include "prima-nota.dbEnv" . | nindent 8 }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "prima-nota.fullname" . }}-secret
              key: jwt-secret
        - name: FRONTEND_URL
          value: {{ include "prima-nota.publicUrl" . | quote }}
        - name: ALLEGATI_DIR
          value: /app/uploads/allegati
        {{- if not (hasKey .Values.backend.env "TRUST_PROXY") }}
        # Proxy davanti al backend (blocco K2): ingress + nginx del frontend, o solo nginx.
        - name: TRUST_PROXY
          value: {{ ternary "2" "1" .Values.ingress.enabled | quote }}
        {{- end }}
        {{- if or .Values.backend.smtpPassword.existingSecret .Values.backend.smtpPassword.value }}
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: {{ .Values.backend.smtpPassword.existingSecret | default (printf "%s-secret" (include "prima-nota.fullname" .)) }}
              key: {{ ternary .Values.backend.smtpPassword.key "smtp-password" (not (empty .Values.backend.smtpPassword.existingSecret)) }}
        {{- end }}
        # backend.env: le variabili vuote non si passano (il backend usa i suoi default).
        {{- range $k, $v := .Values.backend.env }}
        {{- if and (not (has $k (list "JWT_SECRET" "FRONTEND_URL" "ALLEGATI_DIR" "SMTP_PASS" "DB_HOST" "DB_PORT" "DB_NAME" "DB_USER" "DB_PASSWORD"))) (ne (toString $v) "") }}
        - name: {{ $k }}
          value: {{ include "prima-nota.envValue" $v }}
        {{- end }}
        {{- end }}
        ports:
        - name: backend
          containerPort: {{ .Values.backend.env.PORT }}
          protocol: TCP
        {{- if .Values.backend.livenessProbe }}
        livenessProbe:
          {{- toYaml .Values.backend.livenessProbe | nindent 10 }}
        {{- else }}
        livenessProbe:
          tcpSocket:
            port: backend
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        {{- if .Values.backend.readinessProbe }}
        readinessProbe:
          {{- toYaml .Values.backend.readinessProbe | nindent 10 }}
        {{- else }}
        readinessProbe:
          tcpSocket:
            port: backend
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        {{- end }}
        resources:
          {{- toYaml .Values.backend.resources | nindent 10 }}
        volumeMounts:
        - name: allegati
          mountPath: /app/uploads/allegati
      volumes:
      - name: allegati
        {{- if $p.enabled }}
        persistentVolumeClaim:
          claimName: {{ $p.existingClaim | default (printf "%s-allegati" (include "prima-nota.fullname" .)) }}
        {{- else }}
        # Senza persistenza gli allegati spariscono a ogni riavvio del pod.
        emptyDir: {}
        {{- end }}
{{- end }}
