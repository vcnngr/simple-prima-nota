# docker-compose.prod.yml

services:
  # Database PostgreSQL. 16.15-bookworm: stessa glibc (2.36) del 16.1 con cui
  # sono nati i volumi esistenti; il tag senza suffisso e' trixie (glibc 2.41)
  # e porta a "collation version mismatch" (docs/SISTEMA.md, S4).
  db:
    image: docker.io/library/postgres:16.15-bookworm
    container_name: prima_nota_db
    environment:
      POSTGRES_DB: prima_nota
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - prima_nota_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Schema e migrazioni (database/migra.sh): crea lo schema su un volume vuoto,
  # applica solo le migrazioni mancanti su uno esistente, poi esce. Il backend
  # parte solo se questo e' uscito con 0.
  migra:
    image: docker.io/library/postgres:16.15-bookworm
    container_name: prima_nota_migra
    environment:
      PGHOST: db
      PGDATABASE: prima_nota
      PGUSER: postgres
      PGPASSWORD: password123
    volumes:
      - ./database:/database:ro
    command: ["bash", "/database/migra.sh", "applica"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prima_nota_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prima_nota_backend
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: prima_nota
      DB_USER: postgres
      DB_PASSWORD: password123
      # K5: niente segreto di esempio (il backend in produzione non parte). Si mette
      # in un file .env accanto a questo: echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
      JWT_SECRET: ${JWT_SECRET:?imposta JWT_SECRET nel file .env accanto a docker-compose.yml (openssl rand -hex 32)}
      PORT: 3001
      TRUST_PROXY: "1"
      # Notifiche email: in sviluppo vanno a mailpit (http://localhost:8025).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Simple Prima Nota <no-reply@localhost>
      FRONTEND_URL: http://localhost:3000
      ALLEGATI_DIR: /app/uploads/allegati
    volumes:
      # Allegati della chat: fuori dall'immagine, sopravvivono al rebuild.
      - allegati_data:/app/uploads
    ports:
      # Solo da questa macchina: da fuori si passa da nginx (porta 3000), che
      # scrive l'indirizzo del client in X-Forwarded-For (TRUST_PROXY: 1).
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      migra:
        condition: service_completed_successfully
    networks:
      - prima_nota_network

  # Frontend (web/, Vite + React, dal blocco U6d) servito da nginx, che fa da
  # proxy per /api.
  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: prima_nota_frontend
    environment:
      # Variabili del modello nginx (web/nginx/default.conf.template); questi
      # sono gia' i default dell'immagine. Allegati piu' grandi di 10 MB: alzare
      # CLIENT_MAX_BODY_SIZE insieme ad ALLEGATI_MAX_BYTES del backend.
      BACKEND_UPSTREAM: backend:3001
      CLIENT_MAX_BODY_SIZE: 11m
    ports:
      - "3000:80"  # Nginx espone sulla porta 80
    depends_on:
      - backend
    networks:
      - prima_nota_network
    # NESSUN volume mapping e NESSUN command override per produzione

  # Casella di prova per le notifiche email (solo sviluppo): nessuna mail esce
  # davvero, si leggono su http://localhost:8025.
  mailpit:
    image: docker.io/axllent/mailpit
    container_name: prima_nota_mailpit
    ports:
      - "8025:8025"
    networks:
      - prima_nota_network

  # Adminer per gestione database (opzionale)
  adminer:
    image: docker.io/library/adminer
    container_name: prima_nota_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - prima_nota_network
    depends_on:
      - db

volumes:
  postgres_data:
  allegati_data:

networks:
  prima_nota_network:
    driver: bridge
