# docker-compose.prod.yml

services:
  # Database PostgreSQL
  db:
    image: docker.io/library/postgres:16.1
    container_name: prima_nota_db
    environment:
      POSTGRES_DB: prima_nota
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./database/migrations/001_commercialisti_system.sql:/docker-entrypoint-initdb.d/02-commercialisti.sql
      - ./database/migrations/002_workflow_collegamento.sql:/docker-entrypoint-initdb.d/03-workflow-collegamento.sql
      - ./database/migrations/003_invito_irrigidito.sql:/docker-entrypoint-initdb.d/04-invito-irrigidito.sql
      - ./database/migrations/004_richieste_idempotenti.sql:/docker-entrypoint-initdb.d/05-richieste-idempotenti.sql
      - ./database/migrations/005_accessi_commercialista.sql:/docker-entrypoint-initdb.d/06-accessi-commercialista.sql
      - ./database/migrations/006_notifiche.sql:/docker-entrypoint-initdb.d/07-notifiche.sql
    ports:
      - "5432:5432"
    networks:
      - prima_nota_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prima_nota_backend
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: prima_nota
      DB_USER: postgres
      DB_PASSWORD: password123
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 3001
      # Notifiche email: in sviluppo vanno a mailpit (http://localhost:8025).
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: Simple Prima Nota <no-reply@localhost>
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prima_nota_network

  # Frontend React - MODALITÀ PRODUZIONE (NGINX con proxy API)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # Usa il Dockerfile multi-stage con nginx
    container_name: prima_nota_frontend
    environment:
      # L'API sarà servita tramite nginx proxy, quindi usiamo path relativo
      REACT_APP_API_URL: /api
    ports:
      - "3000:80"  # Nginx espone sulla porta 80
    depends_on:
      - backend
    networks:
      - prima_nota_network
    # NESSUN volume mapping e NESSUN command override per produzione

  # Casella di prova per le notifiche email (solo sviluppo): nessuna mail esce
  # davvero, si leggono su http://localhost:8025.
  mailpit:
    image: docker.io/axllent/mailpit
    container_name: prima_nota_mailpit
    ports:
      - "8025:8025"
    networks:
      - prima_nota_network

  # Adminer per gestione database (opzionale)
  adminer:
    image: docker.io/library/adminer
    container_name: prima_nota_adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - prima_nota_network
    depends_on:
      - db

volumes:
  postgres_data:

networks:
  prima_nota_network:
    driver: bridge
